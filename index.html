<!doctype html>

<head>
<meta charset="utf-8">

<title>Will My Money Be Enough?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div class="langbar" role="group" aria-label="Language"><span><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg><span data-t="lang"></span></span><div class="seg" id="langSeg"><button type="button" data-v="en" lang="en">English</button><button type="button" data-v="zh" lang="zh-CN">简体中文</button><button type="button" data-v="th" lang="th">ไทย</button></div></div>
  <header>
    <div class="hero"><svg class="sprout" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="28" fill="var(--keep-soft)"/><path d="M32 52V30" stroke="var(--keep-ink)" stroke-width="3" stroke-linecap="round"/><path d="M32 34c-11 0-16-7-16-15 9 0 16 5 16 15z" fill="var(--keep)"/><path d="M32 30c0-10 7-15 17-15 0 9-6 15-17 15z" fill="#8FD0A6"/><ellipse cx="32" cy="53" rx="11" ry="3" fill="var(--keep-ink)" opacity=".25"/></svg><h1 data-t="title"></h1></div>
    <p class="sub" data-t="sub"></p>
    <p class="heads" data-t="heads"></p>
  </header>
  <div class="tabs" role="tablist"><button type="button" role="tab" id="tabCalc" data-tab="calc" aria-selected="true" data-t="tab.calc"></button><button type="button" role="tab" id="tabSum" data-tab="sum" aria-selected="false" data-t="tab.sum"></button></div>
  <div id="pageCalc">
      <nav class="toc" id="toc">
        <a href="#s-scen" data-t="toc.scen"></a><a href="#s-ret" data-t="toc.ret"></a><a href="#s-mkt" data-t="toc.mkt"></a><a href="#s-ages" data-t="toc.ages"></a><a href="#s-pay" data-t="toc.pay"></a><a href="#s-decide" data-t="toc.decide"></a><a href="#s-today" data-t="sm.today"></a><a href="#s-life" data-t="sm.check.h"></a><a href="#s-ins" data-t="sm.ins.h"></a><a href="#s-plans" data-t="toc.plans"></a>
      </nav>

  <section class="panel" aria-labelledby="h-inputs">
    <h2 id="h-inputs" data-t="yourNumbers"></h2>
    <div class="grid four">
      <div class="field"><label for="start" data-l="f.start"></label><div class="box"><input id="start" data-save data-money inputmode="decimal" autocomplete="off"></div></div>
      <div class="field"><label for="monthly" data-l="f.monthly"></label><div class="box"><input id="monthly" data-save data-money inputmode="decimal" autocomplete="off"></div></div>
      <div class="field"><label for="raise" data-l="f.raise" data-h="f.raise.h"></label><div class="box"><input id="raise" data-save inputmode="decimal" autocomplete="off" data-ph="f.raise.ph"><span class="suf">%</span></div></div>
      <div class="field"><label for="infl" data-l="f.infl" data-h="f.infl.h"></label><div class="box"><input id="infl" data-save inputmode="decimal" autocomplete="off"><span class="suf">%</span></div></div>
      <div class="field"><label for="growth" data-l="f.growth" data-h="f.beforeInfl"></label><div class="box"><input id="growth" data-save inputmode="decimal" autocomplete="off"><span class="suf">%</span></div></div>
      <div class="field"><label for="growth2" data-l="f.growth2" data-h="f.growth2.h"></label><div class="box"><input id="growth2" data-save inputmode="decimal" autocomplete="off"><span class="suf">%</span></div></div>
      <p class="note" style="grid-column:1/-1;margin:-6px 0 0" data-t="f.growth.note"></p>
      <div class="field"><label for="age" data-l="f.age"></label><div class="box"><input id="age" data-save inputmode="numeric" autocomplete="off"></div></div>
      <div class="field"><label for="retire" data-l="f.retire"></label><div class="box"><input id="retire" data-save inputmode="numeric" autocomplete="off"></div></div>
      <label class="tog" style="grid-column:1/-1;margin:-4px 0 0"><input type="checkbox" id="noRetire" data-save> <span data-t="f.noRetire"></span></label>
      <div class="field"><label for="spend" data-l="f.spend" data-h="f.spend.h"></label><div class="box"><input id="spend" data-save data-money inputmode="decimal" autocomplete="off" data-ph="none"></div></div>
    </div>
    <p class="tip" data-t="tip"></p>

    <h3 data-t="lines.h"></h3>
    <p class="note" data-t="lines.note"></p>
    <div class="grid">
      <div class="field"><label for="s1" data-l="sc1" data-h="f.s1.h"></label><div class="box"><input id="s1" data-save inputmode="decimal" autocomplete="off"><span class="suf" data-t="ofGain"></span></div></div>
      <div class="field"><label for="s2" data-l="sc2" data-h="f.s2.h"></label><div class="box"><input id="s2" data-save inputmode="decimal" autocomplete="off"><span class="suf" data-t="ofGain"></span></div></div>
    </div>

    <details class="extras" id="extras">
      <summary><span data-t="ex.sum"></span><span class="excount" id="exCount"></span></summary>
      <p class="note" data-t="ex.note"></p>
      <div class="grid four" id="exBasic"></div>
      <h4 data-t="ex.steps"></h4>
      <p class="note" data-t="ex.steps.note"></p>
      <div id="exSteps"></div>
      <h4 data-t="ex.inc"></h4>
      <p class="note" data-t="ex.inc.note"></p>
      <div id="exInc"></div><input type="hidden" id="nInc" data-save>
      <h4 data-t="ex.one"></h4>
      <p class="note" data-t="ex.one.note"></p>
      <div id="exOne"></div><input type="hidden" id="nOne" data-save>
      <h4 data-t="ex.two"></h4>
      <label class="tog"><input type="checkbox" id="two" data-save> <span data-t="ex.two.tog"></span></label>
      <div id="partner" class="grid four" hidden></div>
    </details>

    <div class="showas"><span data-t="showAs"></span><div class="seg" id="unitSeg"><button type="button" data-v="cash" aria-pressed="true" data-t="u.cash"></button><button type="button" data-v="real" aria-pressed="false" data-t="u.real"></button></div></div>
    <p class="note" id="unitExplain" style="margin:6px 0 0"></p>
    <div class="showas"><span data-t="look"></span><div class="seg" id="lookSeg"><button type="button" data-v="cream" aria-pressed="true" data-t="look.cream"></button><button type="button" data-v="night" aria-pressed="false" data-t="look.night"></button></div></div>
    <p class="warn" id="msg" role="alert"></p>
    <button class="reset" id="reset" type="button" data-t="reset"></button>
  </section>

  <section class="verdict" id="s-scen" aria-live="polite">
    <p class="lead" id="lead"></p>
    <p class="today" id="unitNote"></p>
    <div class="row c1"><span class="tag">1</span><div>
      <p class="name" data-t="sc1.name"></p>
      <p class="fig"><strong id="f1"></strong><span id="fc1"></span></p>
      <p class="text" id="v1"></p>
    </div></div>
    <div class="row c2"><span class="tag">2</span><div>
      <p class="name" data-t="sc2.name"></p>
      <p class="fig"><strong id="f2"></strong><span id="fc2"></span></p>
      <p class="text" id="v2"></p>
    </div></div>
    <div class="row c3"><span class="tag">3</span><div>
      <p class="name" data-t="sc3.name"></p>
      <p class="fig"><strong id="f3"></strong><span id="fc3"></span></p>
      <p class="text" id="v3"></p>
    </div></div>
    <div class="row cc" id="coastRow" hidden><span class="tag" data-t="coast.tag"></span><div>
      <p class="name" data-t="coast.name"></p>
      <p class="fig"><strong id="fC"></strong><span id="fcC"></span></p>
      <p class="text" id="vC"></p>
    </div></div>
  </section>

  <section class="block" aria-labelledby="h-pot">
    <h2 id="h-pot"></h2>
    <ul class="key">
      <li><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--keep);stroke-width:2.5"/></svg><span data-t="keepPaying"></span></li>
      <li><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--stop-ink);stroke-width:2;stroke-dasharray:5 4"/></svg><span data-t="key.stop"></span></li>
      <li id="keyNeed" hidden><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--coast-ink);stroke-width:1.5;stroke-dasharray:2 3"/></svg><span data-t="key.need"></span></li>
    </ul>
    <div class="chart"><canvas id="potChart" role="img"></canvas></div>
    <div class="stopper">
      <div class="stop-head"><label for="stop" id="stopLbl"></label><output id="stopOut" for="stop"></output></div>
      <input type="range" id="stop" min="30" max="60" step="1" value="45">
      <p class="compare-title" id="cTitle"></p>
      <div class="compare">
        <div><span id="dFull"></span><strong id="cFull"></strong></div>
        <div><span id="dStop"></span><strong id="cStop"></strong></div>
        <div><span data-t="costStop"></span><strong id="cCost"></strong></div>
        <div><span data-t="freed"></span><strong id="cFree"></strong></div>
      </div>
      <p class="ratio" id="cRatio"></p>
    </div>
  </section>

  <section class="block" aria-labelledby="h-share">
    <h2 id="h-share" data-t="share.h"></h2>
    <div class="chart"><canvas id="shareChart" role="img"></canvas></div>
  </section>

  <section class="part" id="s-ret" aria-labelledby="h-ret">
    <h2 class="big" id="h-ret" data-t="toc.ret"></h2>
    <p class="intro" data-t="ret.intro"></p>
    <div class="grid">
      <div class="field"><label for="yield" data-l="f.yield" data-h="f.yield.h"></label><div class="box"><input id="yield" data-save inputmode="decimal" autocomplete="off"><span class="suf" data-t="ofPot"></span></div></div>
    </div>
    <p class="rlead" id="rLead"></p>
    <div class="rtable" role="table">
      <div class="rrow rhead" role="row"><span role="columnheader"></span><span role="columnheader" data-t="keepPaying"></span><span role="columnheader" id="rStopHead"></span></div>
      <div class="rrow" role="row"><span role="rowheader" id="rl0"></span><span id="rk0"></span><span id="rs0"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="rt.div"></span><span id="rk1"></span><span id="rs1"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="rt.val"></span><span id="rk2"></span><span id="rs2"></span></div>
      <div class="rrow" role="row" id="rrFee"><span role="rowheader" data-t="rt.fee"></span><span id="rk3"></span><span id="rs3"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="rt.tot"></span><span id="rk4"></span><span id="rs4"></span></div>
      <div class="rrow" role="row" id="rrInc"><span role="rowheader" data-t="rt.inc"></span><span id="rk5"></span><span id="rs5"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="rt.wd"></span><span id="rk6"></span><span id="rs6"></span></div>
      <div class="rrow" role="row" id="rrTax"><span role="rowheader" data-t="rt.tax"></span><span id="rk7"></span><span id="rs7"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="rt.share"></span><span id="rk8"></span><span id="rs8"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="rt.what"></span><span id="rk9"></span><span id="rs9"></span></div>
    </div>
    <p class="note" style="margin-top:6px" data-t="rt.note"></p>
    <div class="stopper">
      <div class="stop-head"><label for="live" data-t="liveTo"></label><output id="liveOut" for="live"></output></div>
      <input type="range" id="live" min="61" max="121" step="1" value="90">
      <p class="compare-title" id="leftTitle"></p>
      <div class="figs">
        <p class="fig ck"><span data-t="keepPaying"></span><strong id="leftK"></strong></p>
        <p class="fig cs"><span id="leftSLabel"></span><strong id="leftS"></strong></p>
      </div>
      <p class="ratio" id="leftNote"></p>
    </div>
    <div class="block" style="margin-top:22px">
      <h2 id="h-retc"></h2>
      <div class="chart"><canvas id="retChart" role="img"></canvas></div>
      <p class="rneed" id="rNeed"></p>
    </div>
  </section>

  <section class="part" id="s-mkt" aria-labelledby="h-mkt">
    <h2 class="big" id="h-mkt" data-t="toc.mkt"></h2>
    <p class="intro" data-t="mkt.intro"></p>
    <div class="grid four">
      <div class="field"><label for="vol1" data-l="f.vol1" data-h="f.vol1.h"></label><div class="box"><input id="vol1" data-save inputmode="decimal" autocomplete="off"><span class="suf">%</span></div></div>
      <div class="field"><label for="vol2" data-l="f.vol2"></label><div class="box"><input id="vol2" data-save inputmode="decimal" autocomplete="off"><span class="suf">%</span></div></div>
    </div>
    <div class="bigchance"><strong id="mcChance">–</strong><span id="mcCap"></span></div>
    <p class="busy" id="mcBusy"></p>
    <p class="rlead" id="mcLead"></p>
    <div class="figs three">
      <p class="fig cs"><span data-t="run.poor"></span><strong id="mcP10"></strong></p>
      <p class="fig ck"><span data-t="run.typ"></span><strong id="mcP50"></strong></p>
      <p class="fig c1"><span data-t="run.good"></span><strong id="mcP90"></strong></p>
    </div>
    <p class="note" style="margin-top:8px" id="mcFigNote"></p>
    <p class="ratio" id="mcFix"></p>
    <div class="block" style="margin-top:18px">
      <h2 id="h-mcc"></h2>
      <ul class="key">
        <li><svg width="22" height="10" aria-hidden="true"><rect x="0" y="1" width="22" height="8" style="fill:var(--keep-fill)"/></svg><span data-t="key.band"></span></li>
        <li><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--keep);stroke-width:2.5"/></svg><span data-t="run.typ"></span></li>
        <li><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--stop-ink);stroke-width:2;stroke-dasharray:5 4"/></svg><span data-t="steady"></span></li>
      </ul>
      <div class="chart"><canvas id="mcChart" role="img"></canvas></div>
    </div>
    <h3 data-t="bs.h"></h3>
    <div class="grid" style="margin-top:8px">
      <div class="field"><label for="fall" data-l="f.fall"></label><div class="box"><input id="fall" data-save inputmode="decimal" autocomplete="off"><span class="suf">%</span></div></div>
    </div>
    <p class="ratio" id="bsText"></p>
  </section>

  <section class="part" id="s-ages" aria-labelledby="h-ages">
    <h2 class="big" id="h-ages" data-t="toc.ages"></h2>
    <p class="intro" data-t="ages.intro"></p>
    <div class="rtable four" role="table">
      <div class="rrow rhead plain" role="row"><span role="columnheader"></span><span role="columnheader" id="ag0h"></span><span role="columnheader" id="ag1h"></span><span role="columnheader" id="ag2h"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="potAtRet"></span><span id="ag0a"></span><span id="ag1a"></span><span id="ag2a"></span></div>
      <div class="rrow" role="row"><span role="rowheader" id="agNeedL"></span><span id="ag0b"></span><span id="ag1b"></span><span id="ag2b"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="lastsTo"></span><span id="ag0c"></span><span id="ag1c"></span><span id="ag2c"></span></div>
      <div class="rrow" role="row"><span role="rowheader" id="agPayL"></span><span id="ag0d"></span><span id="ag1d"></span><span id="ag2d"></span></div>
      <div class="rrow" role="row"><span role="rowheader" data-t="ages.chance"></span><span id="ag0e"></span><span id="ag1e"></span><span id="ag2e"></span></div>
    </div>
  </section>

  <section class="part" id="s-pay" aria-labelledby="h-fix">
    <h2 class="big" id="h-fix" data-t="fx.h"></h2>
    <p class="intro" id="fxIntro"></p>
    <div class="ck" id="fxFigWrap"><p class="fig"><strong id="fxFig"></strong><span id="fxCap"></span></p></div>
    <div class="opts" id="fxOpts">
      <div class="opt"><p class="olabel" data-t="fx.now"></p><div class="ostats">
        <div><span data-t="payMonth"></span><strong id="o0a"></strong></div><div><span class="potlbl"></span><strong id="o0b"></strong></div><div><span data-t="lastsTo"></span><strong id="o0c"></strong></div></div></div>
      <div class="opt main"><p class="olabel" id="o1l"></p><div class="ostats">
        <div><span data-t="payMonth"></span><strong id="o1a"></strong></div><div><span class="potlbl"></span><strong id="o1b"></strong></div><div><span data-t="lastsTo"></span><strong id="o1c"></strong></div></div></div>
      <div class="opt"><p class="olabel" id="o2l"></p><div class="ostats">
        <div><span data-t="payMonth"></span><strong id="o2a"></strong></div><div><span class="potlbl"></span><strong id="o2b"></strong></div><div><span data-t="lastsTo"></span><strong id="o2c"></strong></div></div></div>
      <div class="opt"><p class="olabel" data-t="fx.never"></p><div class="ostats">
        <div><span data-t="payMonth"></span><strong id="o3a"></strong></div><div><span class="potlbl"></span><strong id="o3b"></strong></div><div><span data-t="lastsTo"></span><strong id="o3c"></strong></div></div></div>
    </div>
    <button class="usebtn" id="useBtn" type="button" hidden></button>
    <p class="small" id="fxNote"></p>
  </section>

  <section class="part" id="s-decide" aria-labelledby="h-decide">
    <h2 class="big" id="h-decide" data-t="dec.h"></h2>
    <p class="intro" id="dIntro"></p>
    <div class="why">
      <div class="ck"><h3 data-t="dec.keepH"></h3><ul id="whyKeep"></ul></div>
      <div class="c1"><h3 data-t="dec.spendH"></h3><ul id="whySpend"></ul></div>
    </div>
    <h3 data-t="dec.check"></h3>
    <div class="field solo" style="margin-top:10px"><label for="pay" id="payLbl"></label><div class="box"><input id="pay" data-save data-money inputmode="decimal" autocomplete="off" placeholder="–"></div></div>
    <div class="checks">
      <div class="check"><span class="pill" id="pA"></span><div><p class="q" data-t="q.a"></p><p class="a" id="aA"></p></div></div>
      <div class="check"><span class="pill" id="pB"></span><div><p class="q" id="qB"></p><p class="a" id="aB"></p></div></div>
      <div class="check"><span class="pill" id="pC"></span><div><p class="q" data-t="q.c"></p><p class="a" id="aC"></p></div></div>
      <div class="check"><span class="pill" id="pD"></span><div><p class="q" data-t="q.d"></p><p class="a" id="aD"></p></div></div>
      <div class="check"><span class="pill" id="pE"></span><div><p class="q" data-t="q.e"></p><div class="yn" data-key="match"><button type="button" data-v="yes" aria-pressed="false" data-t="yes"></button><button type="button" data-v="no" aria-pressed="false" data-t="no"></button></div><p class="a" id="aE"></p></div></div>
      <div class="check"><span class="pill" id="pF"></span><div><p class="q" data-t="q.f"></p><div class="yn" data-key="cash"><button type="button" data-v="yes" aria-pressed="false" data-t="yes"></button><button type="button" data-v="no" aria-pressed="false" data-t="no"></button></div><p class="a" id="aF"></p></div></div>
      <div class="check"><span class="pill" id="pG"></span><div><p class="q" id="qG"></p><div class="yn" data-key="debt"><button type="button" data-v="yes" aria-pressed="false" data-t="yes"></button><button type="button" data-v="no" aria-pressed="false" data-t="no"></button></div><p class="a" id="aG"></p></div></div>
      <div class="check"><span class="pill" id="pH"></span><div><p class="q" data-t="q.h"></p><div class="yn" data-key="life"><button type="button" data-v="yes" aria-pressed="false" data-t="yes"></button><button type="button" data-v="no" aria-pressed="false" data-t="no"></button></div><p class="a" id="aH"></p></div></div>
    </div>
    <div class="decision" id="decision" aria-live="polite">
      <p class="dlabel" data-t="dec.points"></p>
      <p class="dhead" id="dHead"></p>
      <p class="dtext" id="dText"></p>
    </div>
    <p class="small" data-t="dec.disclaim"></p>
  </section>

  <section class="part" id="s-today" aria-labelledby="h-today">
    <h2 class="big" id="h-today" data-t="sm.today"></h2>
    <p class="intro" data-t="sm.today.intro"></p>
        <div class="grid four">
      <div class="field"><label for="sIncome" data-l="pay.l1" data-h="optional"></label><div class="box"><input id="sIncome" data-money data-mirror="pay" inputmode="decimal" autocomplete="off" placeholder="–"></div></div>
      <div class="field"><label for="sSpend" data-l="s.spend" data-h="s.spend.h"></label><div class="box"><input id="sSpend" data-save data-money inputmode="decimal" autocomplete="off" placeholder="–"></div></div>
